<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Alive - 今、この瞬間の地球を眺める</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  canvas { display: block; touch-action: none; }

  #title {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.35em;
    font-size: 0.8rem;
    font-weight: 300;
    text-shadow: 0 0 12px rgba(0,0,0,0.8);
    pointer-events: none;
    user-select: none;
    transition: opacity 1.2s ease;
  }

  #back {
    position: fixed;
    top: 56px;
    left: 20px;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    transition: opacity 1.2s ease, color 0.2s, border-color 0.2s;
    z-index: 10;
  }
  #back:hover {
    color: rgba(255,255,255,0.95);
    border-color: rgba(255,255,255,0.6);
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    z-index: 20;
    background: #000;
    transition: opacity 0.8s ease;
  }

  .fade-idle #title,
  .fade-idle #back,
  .fade-idle #effectsToggle {
    opacity: 0;
  }

  #effectsToggle {
    position: fixed;
    top: 56px;
    right: 20px;
    color: rgba(255,255,255,0.55);
    background: transparent;
    font-family: inherit;
    letter-spacing: 0.05em;
    font-size: 0.85rem;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    cursor: pointer;
    transition: opacity 1.2s ease, color 0.2s, border-color 0.2s;
    z-index: 10;
  }
  #effectsToggle:hover {
    color: rgba(255,255,255,0.95);
    border-color: rgba(255,255,255,0.6);
  }

  #effectsPanel {
    position: fixed;
    top: 94px;
    right: 20px;
    min-width: 190px;
    background: rgba(15,18,24,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 16px;
    z-index: 10;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #effectsPanel.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #effectsPanel label {
    display: flex;
    align-items: center;
    gap: 9px;
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    padding: 6px 0;
    cursor: pointer;
    user-select: none;
  }
  #effectsPanel input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: #6fa8ff;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="loading">LOADING EARTH…</div>
<a id="back" href="index.html">&larr; 天気予報へ戻る</a>
<div id="title">EARTH&nbsp;ALIVE</div>

<button id="effectsToggle">EFFECTS ▾</button>
<div id="effectsPanel">
  <label><input type="checkbox" id="fx-clouds" checked> 雲</label>
  <label><input type="checkbox" id="fx-citylights"> 都市の灯り</label>
  <label><input type="checkbox" id="fx-iss" checked> ISS（国際宇宙ステーション）</label>
  <label><input type="checkbox" id="fx-aurora" checked> オーロラ</label>
  <label><input type="checkbox" id="fx-lightning" checked> 雷</label>
</div>

<script src="https://cdn.jsdelivr.net/npm/satellite.js@5/dist/satellite.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ----- 基本セットアップ -----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ----- 背景の星空 -----
const starGeo = new THREE.SphereGeometry(80, 64, 64);
const starLoader = new THREE.TextureLoader();
const starTex = starLoader.load("textures/2k_stars_milky_way.jpg");
starTex.colorSpace = THREE.SRGBColorSpace;
const starMat = new THREE.MeshBasicMaterial({ map: starTex, side: THREE.BackSide });
scene.add(new THREE.Mesh(starGeo, starMat));

// ----- 太陽（平行光源） -----
const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.position.set(5, 2, 3);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223344, 0.06));

// ----- 地球本体（昼/夜をカスタムシェーダーでブレンド） -----
const loader = new THREE.TextureLoader();
let loaded = 0;
const total = 3;
function onTexLoaded() {
  loaded++;
  if (loaded >= total) {
    document.getElementById("loading").style.opacity = "0";
    setTimeout(() => document.getElementById("loading").remove(), 900);
  }
}

const dayTex = loader.load("textures/2k_earth_daymap.jpg", onTexLoaded);
const nightTex = loader.load("textures/2k_earth_nightmap.jpg", onTexLoaded);
const cloudsTex = loader.load("textures/2k_earth_clouds.jpg", onTexLoaded);
dayTex.colorSpace = THREE.SRGBColorSpace;
nightTex.colorSpace = THREE.SRGBColorSpace;
cloudsTex.colorSpace = THREE.SRGBColorSpace;

const earthGeo = new THREE.SphereGeometry(2, 128, 128);

const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    dayTexture: { value: dayTex },
    nightTexture: { value: nightTex },
    sunDirection: { value: new THREE.Vector3(1, 0, 0) },
    nightBoost: { value: 0.35 },
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D dayTexture;
    uniform sampler2D nightTexture;
    uniform vec3 sunDirection;
    uniform float nightBoost;
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
      float intensity = dot(normalize(vNormal), normalize(sunDirection));
      float mixFactor = smoothstep(-0.4, -0.1, intensity);

      vec4 dayColor = texture2D(dayTexture, vUv);
      // 海だけを狙って明るく鮮やかな青に(青が赤・緑より強いピクセル=海、という単純な判定)
      float oceanMask = clamp((dayColor.b - max(dayColor.r, dayColor.g)) * 5.0, 0.0, 1.0);
      dayColor.rgb = mix(dayColor.rgb, dayColor.rgb * vec3(1.0, 1.12, 1.4) + vec3(0.0, 0.01, 0.03), oceanMask);

      vec3 nightRaw = texture2D(nightTexture, vUv).rgb;
      // 街の灯りは暗いピクセルが多いので、明るい部分（都市）だけを強く持ち上げる
      vec3 nightColor = pow(nightRaw, vec3(0.7)) * 2.2 * nightBoost;

      vec3 color = mix(nightColor, dayColor.rgb, mixFactor);

      // ゴールデンアワー: 昼夜境界(mixFactorの中心と同じ位置)にオレンジ〜紫の細い帯を重ねる
      const float TERMINATOR_CENTER = -0.25;
      float distFromTerminator = abs(intensity - TERMINATOR_CENTER);
      float band = 1.0 - smoothstep(0.0, 0.18, distFromTerminator);
      vec3 goldenColor = mix(vec3(1.0, 0.45, 0.15), vec3(0.35, 0.15, 0.55), smoothstep(0.0, 1.0, (intensity - TERMINATOR_CENTER) * 1.6));
      color = mix(color, color + goldenColor * 0.7, band * 0.6);

      gl_FragColor = vec4(color, 1.0);
    }
  `,
});

const earth = new THREE.Mesh(earthGeo, earthMat);
scene.add(earth);

// ----- 雲レイヤー -----
const cloudsMat = new THREE.MeshStandardMaterial({
  map: cloudsTex,
  transparent: true,
  opacity: 0.45,
  blending: THREE.NormalBlending,
  depthWrite: false,
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(2.015, 128, 128), cloudsMat);
scene.add(clouds);

// ----- 大気の光彩（ふちの淡いグロー） -----
const atmosphereMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.68 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.5);
      gl_FragColor = vec4(0.35, 0.6, 1.0, 1.0) * intensity;
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true,
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(2.15, 128, 128), atmosphereMat);
scene.add(atmosphere);

// ----- 緯度経度 → 地球ローカル座標（テクスチャのUV展開に合わせる） -----
function latLonToVector3(lat, lon, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

// 小さな光の玉のテクスチャ（グロー用）を描いて使い回す
function makeGlowTexture(color) {
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, `rgba(${color}, 1)`);
  grad.addColorStop(0.35, `rgba(${color}, 0.7)`);
  grad.addColorStop(1, `rgba(${color}, 0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

// ----- ISS（国際宇宙ステーション）: 実際の軌道要素から現在位置と軌道を描画 -----
const EARTH_RADIUS_KM = 6371;
const glowTex = makeGlowTexture("255, 255, 255");

const issGroup = new THREE.Group();
issGroup.visible = false;
earth.add(issGroup);

const issSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  color: 0xbfe3ff,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
}));
issSprite.scale.set(0.16, 0.16, 1);
issGroup.add(issSprite);

const issTrailMat = new THREE.LineBasicMaterial({
  color: 0x6fc3ff,
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending,
});
const issTrailGeo = new THREE.BufferGeometry();
const issTrail = new THREE.Line(issTrailGeo, issTrailMat);
issTrail.visible = false;
// 軌跡の各点はすでに地球中心からの絶対座標なので、issGroup(現在地へ移動する)ではなく
// earthに直接ぶら下げる(issGroupの子にすると現在地の分だけ二重にズレてしまう)
earth.add(issTrail);

let issSatrec = null;
async function loadIssTle() {
  try {
    const res = await fetch("https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE", { cache: "no-store" });
    const text = await res.text();
    const lines = text.trim().split("\n");
    issSatrec = satellite.twoline2satrec(lines[1].trim(), lines[2].trim());
    updateIssPosition();
    updateIssTrail();
  } catch (err) {
    console.warn("ISS TLEの取得に失敗しました", err);
  }
}
loadIssTle();

function updateIssPosition() {
  if (!issSatrec) return;
  const now = new Date();
  const posVel = satellite.propagate(issSatrec, now);
  if (!posVel.position) return;
  const gmst = satellite.gstime(now);
  const geo = satellite.eciToGeodetic(posVel.position, gmst);
  const lat = satellite.degreesLat(geo.latitude);
  const lon = satellite.degreesLong(geo.longitude);
  const r = 2 * (EARTH_RADIUS_KM + geo.height) / EARTH_RADIUS_KM;
  issGroup.position.copy(latLonToVector3(lat, lon, r));
}

function updateIssTrail() {
  if (!issSatrec) return;
  const now = new Date();
  const points = [];
  const periodMin = 92.68; // ISSの公転周期(分)のおおよその値
  const steps = 90;
  for (let i = 0; i <= steps; i++) {
    const t = new Date(now.getTime() + (i / steps - 0.5) * periodMin * 60 * 1000);
    const posVel = satellite.propagate(issSatrec, t);
    if (!posVel.position) continue;
    const gmst = satellite.gstime(t);
    const geo = satellite.eciToGeodetic(posVel.position, gmst);
    const lat = satellite.degreesLat(geo.latitude);
    const lon = satellite.degreesLong(geo.longitude);
    const r = 2 * (EARTH_RADIUS_KM + geo.height) / EARTH_RADIUS_KM;
    points.push(latLonToVector3(lat, lon, r));
  }
  issTrailGeo.setFromPoints(points);
}

setInterval(updateIssPosition, 3000);
setInterval(updateIssTrail, 60 * 1000);

// ----- オーロラ: 極域に緑〜青のカーテンをゆらめかせる -----
const auroraMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uOpacity: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uOpacity;
    varying vec2 vUv;

    void main() {
      // vUv.y は 0=北極 / 1=南極。極点そのものはUVが特異点で経度方向の縞が
      // 放射状に見えてしまうため、経度成分は低周波だけにして輪郭を軽くゆらす程度に留める
      //
      // vUv.x は 0→1 で経度を一周するので、継ぎ目(u=0とu=1)で値がぴったり
      // 繋がるように、角周波数は必ず 2π の整数倍にする(そうしないと
      // テクスチャの端で帯の太さや色がブツッと不連続になる)
      const float TWO_PI = 6.28318530718;
      float distFromPole = min(vUv.y, 1.0 - vUv.y);
      float edgeWave = sin(vUv.x * TWO_PI * 3.0 + uTime * 0.4) * 0.012;
      float d = distFromPole - edgeWave;
      float innerFade = smoothstep(0.0, 0.05, d);
      float outerFade = 1.0 - smoothstep(0.07, 0.19, d);
      float band = innerFade * outerFade;
      if (band <= 0.001 || uOpacity <= 0.001) discard;

      float flicker = 0.65 + 0.35 * sin(uTime * 1.3) * sin(uTime * 0.53 + vUv.x * TWO_PI * 2.0);
      float hue = 0.5 + 0.5 * sin(uTime * 0.35 + vUv.x * TWO_PI * 2.0);
      vec3 color = mix(vec3(0.15, 1.0, 0.55), vec3(0.3, 0.6, 1.0), hue);

      float alpha = band * flicker * uOpacity * 0.85;
      gl_FragColor = vec4(color, alpha);
    }
  `,
  transparent: true,
  side: THREE.FrontSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const aurora = new THREE.Mesh(new THREE.SphereGeometry(2.05, 128, 128), auroraMat);
earth.add(aurora);

// ----- 雷: 雲の上でランダムに一瞬白く光る -----
const lightningTex = makeGlowTexture("255, 255, 245");
const activeFlashes = [];
let lightningEnabled = true;
let nextFlashIn = 2 + Math.random() * 2;

function spawnLightning() {
  const lat = (Math.random() - 0.5) * 110; // 高緯度すぎる場所は避ける
  const lon = Math.random() * 360 - 180;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: lightningTex,
    color: 0xffffee,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  }));
  sprite.position.copy(latLonToVector3(lat, lon, 2.03));
  sprite.scale.set(0.22, 0.22, 1);
  earth.add(sprite);
  activeFlashes.push({ sprite, age: 0 });
}

// ----- 太陽の方向を実際の日時から計算(簡易) -----
function updateSunDirection() {
  const now = new Date();
  const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60;
  // 12:00 UTC で経度0度が正午になるよう簡易モデル化
  const angle = ((utcHours / 24) * Math.PI * 2) + Math.PI;
  const sunDir = new THREE.Vector3(Math.cos(angle), 0.15, Math.sin(angle));
  earthMat.uniforms.sunDirection.value.copy(sunDir);
  sun.position.copy(sunDir).multiplyScalar(10);
}
updateSunDirection();
setInterval(updateSunDirection, 60 * 1000);

// ----- カメラ操作 -----
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.8;
controls.maxDistance = 14;
controls.rotateSpeed = 0.45;
controls.zoomSpeed = 0.6;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;

// 操作していない時間をトラッキングして、UIをふわっと消す（エフェクトパネルを開いている間は消さない）
const effectsPanel = document.getElementById("effectsPanel");
let idleTimer = null;
function resetIdle() {
  document.body.classList.remove("fade-idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!effectsPanel.classList.contains("open")) {
      document.body.classList.add("fade-idle");
    }
  }, 4000);
}
["pointerdown", "pointermove", "wheel"].forEach(ev =>
  window.addEventListener(ev, resetIdle, { passive: true })
);
resetIdle();

// ----- エフェクトパネルの開閉 -----
const effectsToggle = document.getElementById("effectsToggle");
effectsToggle.addEventListener("click", () => {
  effectsPanel.classList.toggle("open");
  resetIdle();
});

// ----- エフェクト: 雲の表示/非表示（フェードイン・フェードアウト） -----
let cloudsTargetOpacity = 0.45;
document.getElementById("fx-clouds").addEventListener("change", (e) => {
  cloudsTargetOpacity = e.target.checked ? 0.45 : 0;
  resetIdle();
});

// ----- エフェクト: 都市の灯りの強調 -----
let nightBoostTarget = 0.35;
document.getElementById("fx-citylights").addEventListener("change", (e) => {
  nightBoostTarget = e.target.checked ? 1.0 : 0.35;
  resetIdle();
});

// ----- エフェクト: ISS -----
let issTargetOpacity = 1;
document.getElementById("fx-iss").addEventListener("change", (e) => {
  issTargetOpacity = e.target.checked ? 1 : 0;
  resetIdle();
});

// ----- エフェクト: オーロラ -----
let auroraTargetOpacity = 1;
document.getElementById("fx-aurora").addEventListener("change", (e) => {
  auroraTargetOpacity = e.target.checked ? 1 : 0;
  resetIdle();
});

// ----- エフェクト: 雷 -----
document.getElementById("fx-lightning").addEventListener("change", (e) => {
  lightningEnabled = e.target.checked;
  resetIdle();
});

// ----- アニメーションループ -----
const clock = new THREE.Clock();
let issOpacity = 1;
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  earth.rotation.y += delta * 0.02;
  clouds.rotation.y += delta * 0.026;

  // フェードはlerpでなめらかに
  const fade = Math.min(delta * 3, 1);
  cloudsMat.opacity += (cloudsTargetOpacity - cloudsMat.opacity) * fade;
  earthMat.uniforms.nightBoost.value += (nightBoostTarget - earthMat.uniforms.nightBoost.value) * fade;

  // ISS
  issOpacity += (issTargetOpacity - issOpacity) * fade;
  issGroup.visible = issOpacity > 0.01;
  issTrail.visible = issOpacity > 0.01;
  issSprite.material.opacity = issOpacity;
  issTrailMat.opacity = issOpacity * 0.55;

  // オーロラ
  auroraMat.uniforms.uTime.value = elapsed;
  auroraMat.uniforms.uOpacity.value += (auroraTargetOpacity - auroraMat.uniforms.uOpacity.value) * fade;

  // 雷: 一定時間ごとにランダムな場所で光らせる
  if (lightningEnabled) {
    nextFlashIn -= delta;
    if (nextFlashIn <= 0) {
      spawnLightning();
      nextFlashIn = 1.5 + Math.random() * 3.5;
    }
  }
  for (let i = activeFlashes.length - 1; i >= 0; i--) {
    const f = activeFlashes[i];
    f.age += delta;
    const life = 0.6;
    const t = f.age / life;
    // 一瞬でパッと明るくなり、じわっと消える
    f.sprite.material.opacity = t < 0.12 ? t / 0.12 : Math.max(0, 1 - (t - 0.12) / (1 - 0.12));
    const scale = 0.22 + Math.min(t, 0.12) * 0.6;
    f.sprite.scale.set(scale, scale, 1);
    if (f.age >= life) {
      earth.remove(f.sprite);
      f.sprite.material.dispose();
      activeFlashes.splice(i, 1);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
