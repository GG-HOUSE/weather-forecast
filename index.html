<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天狗がいる八王子の天気予報</title>
<style>
    :root {
        color-scheme: light dark;
    }
    body {
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
        background: #f0f4f8;
        color: #222;
        padding: 20px;
        margin: 0;
    }
    h1 {
        text-align: center;
        font-size: 1.4rem;
    }
    h3 {
        text-align: center;
        font-size: 1rem;
        color: #555;
        margin: 28px 0 8px;
    }
    .updated {
        text-align: center;
        color: #666;
        font-size: 0.85rem;
        margin-bottom: 20px;
    }
    .card {
        background: white;
        border-radius: 10px;
        padding: 16px 20px;
        margin: 12px auto;
        max-width: 500px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
    }
    .icons {
        font-size: 1.8rem;
        margin: 4px 0;
        line-height: 1.2;
    }
    .weather {
        font-size: 1.1rem;
        margin: 4px 0;
    }
    .detail {
        color: #555;
        font-size: 0.95rem;
        margin: 2px 0;
    }
    .warnings {
        max-width: 500px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
    }
    .pill {
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.9rem;
        font-weight: bold;
        color: white;
    }
    .pill.special { background: #8e24aa; }
    .pill.warning { background: #d32f2f; }
    .pill.advisory { background: #f9a825; color: #222; }
    .no-warning {
        text-align: center;
        color: #2e7d32;
        font-size: 0.9rem;
    }
    .map-card {
        text-align: center;
        max-width: 500px;
        margin: 0 auto;
    }
    .map-card img {
        max-width: 100%;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .footer {
        text-align: center;
        color: #999;
        font-size: 0.8rem;
        margin-top: 24px;
    }
    .footer a {
        color: #777;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #15181d; color: #e6e6e6; }
        h3 { color: #aaa; }
        .card { background: #22262c; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .detail { color: #aaa; }
        .pill.advisory { color: #222; }
    }
</style>
</head>
<body>
<h1>天狗がいる八王子の天気予報</h1>
<p class="updated" id="updated">読み込み中...</p>

<div id="cards"></div>

<h3>警報・注意報</h3>
<div class="warnings" id="warnings"><p class="no-warning">確認中...</p></div>

<h3>天気図（気象庁発表）</h3>
<div class="map-card" id="mapCard"><p style="text-align:center;">読み込み中...</p></div>

<p class="footer">データ提供: 気象庁</p>

<script>
const OFFICE_CODE = "130000";   // 東京都
const FORECAST_AREA_CODE = "130010"; // 東京地方（八王子市を含む）
const TEMP_AREA_CODE = "44132"; // 東京（大手町）
const HACHIOJI_CLASS20 = "1320100"; // 八王子市（警報・注意報用）

// SKILL.mdで実データ照合済みのコード→名称対応。未知のコードはそのままコード表示する。
const WARNING_CODE_MAP = {
    "03": { name: "大雨警報", level: "warning" },
    "07": { name: "波浪警報", level: "warning" },
    "14": { name: "雷注意報", level: "advisory" },
    "15": { name: "強風注意報", level: "advisory" },
    "16": { name: "波浪注意報", level: "advisory" },
    "20": { name: "濃霧注意報", level: "advisory" },
    "29": { name: "土砂災害警戒情報", level: "danger" }
};

// 天気文の中に出てくる言葉を順番に拾ってアイコンに変換する
const WEATHER_ICON_PATTERNS = [
    { pattern: /晴/, icon: "☀️" },
    { pattern: /雷/, icon: "⚡" },
    { pattern: /雪/, icon: "❄️" },
    { pattern: /雨/, icon: "☔" },
    { pattern: /霧/, icon: "🌫️" },
    { pattern: /曇|くもり/, icon: "☁️" }
];

function getWeatherIcons(text) {
    // 出現位置順に並べたいので、まず各パターンの最初のマッチ位置を調べる
    const found = WEATHER_ICON_PATTERNS
        .map(({ pattern, icon }) => ({ icon, index: text.search(pattern) }))
        .filter(({ index }) => index !== -1)
        .sort((a, b) => a.index - b.index);
    return found.length ? found.map(f => f.icon).join(" ") : "🌡️";
}

async function loadForecast() {
    const cardsEl = document.getElementById("cards");
    const updatedEl = document.getElementById("updated");
    try {
        const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${OFFICE_CODE}.json`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        const shortTerm = data[0];
        const weatherSeries = shortTerm.timeSeries[0];
        const popSeries = shortTerm.timeSeries[1];
        const areaIndex = weatherSeries.areas.findIndex(a => a.area.code === FORECAST_AREA_CODE);
        const weatherArea = weatherSeries.areas[areaIndex >= 0 ? areaIndex : 0];
        const popAreaIndex = popSeries.areas.findIndex(a => a.area.code === FORECAST_AREA_CODE);
        const popArea = popSeries.areas[popAreaIndex >= 0 ? popAreaIndex : 0];

        let tempsByDate = {};
        const weekly = data[1];
        if (weekly) {
            const tempSeries = weekly.timeSeries.find(ts => ts.areas[0].tempsMin || ts.areas[0].tempsMax);
            if (tempSeries) {
                const tempArea = tempSeries.areas.find(a => a.area.code === TEMP_AREA_CODE) || tempSeries.areas[0];
                tempSeries.timeDefines.forEach((d, i) => {
                    const date = d.slice(0, 10);
                    tempsByDate[date] = {
                        min: tempArea.tempsMin ? tempArea.tempsMin[i] : "",
                        max: tempArea.tempsMax ? tempArea.tempsMax[i] : ""
                    };
                });
            }
        }

        const reportDate = new Date(data[0].reportDatetime);
        updatedEl.textContent = "更新: " + reportDate.toLocaleString("ja-JP");

        cardsEl.innerHTML = "";
        weatherSeries.timeDefines.forEach((dateStr, i) => {
            const date = dateStr.slice(0, 10);
            const weather = weatherArea.weathers[i].replace(/\s+/g, " ").trim();

            let pop = "-";
            const popIdx = popSeries.timeDefines.findIndex(d => d.slice(0, 10) === date);
            if (popIdx !== -1 && popArea.pops) {
                pop = popArea.pops[popIdx] + "%";
            }

            const temp = tempsByDate[date];
            const tempText = temp && (temp.min || temp.max)
                ? `最低 ${temp.min || "-"}度 / 最高 ${temp.max || "-"}度`
                : "-";

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h2>${date}</h2>
                <p class="icons">${getWeatherIcons(weather)}</p>
                <p class="weather">${weather}</p>
                <p class="detail">降水確率: ${pop}</p>
                <p class="detail">気温: ${tempText}</p>
            `;
            cardsEl.appendChild(card);
        });
    } catch (err) {
        updatedEl.textContent = "天気データの取得に失敗しました";
        cardsEl.innerHTML = `<p style="text-align:center;color:#c33;">${err.message}</p>`;
    }
}

async function loadWarnings() {
    const warningsEl = document.getElementById("warnings");
    try {
        const res = await fetch(`https://www.jma.go.jp/bosai/warning/data/r8/${OFFICE_CODE}.json`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const events = await res.json();

        // コードごとに最新（reportDatetimeが最大）のステータスだけを残す
        const latestByCode = {};
        for (const event of events) {
            const items = (event.warning && event.warning.class20Items) || [];
            const area = items.find(a => a.areaCode === HACHIOJI_CLASS20);
            if (!area) continue;
            for (const kind of area.kinds) {
                if (!kind.code) continue; // コードなし = 発表なし
                const prev = latestByCode[kind.code];
                if (!prev || new Date(event.reportDatetime) > new Date(prev.reportDatetime)) {
                    latestByCode[kind.code] = { status: kind.status, reportDatetime: event.reportDatetime };
                }
            }
        }

        const active = Object.entries(latestByCode).filter(
            ([, v]) => v.status !== "解除" && !v.status.includes("なし")
        );

        if (active.length === 0) {
            warningsEl.innerHTML = `<p class="no-warning">現在、発表中の警報・注意報はありません</p>`;
            return;
        }

        warningsEl.innerHTML = "";
        active.forEach(([code, v]) => {
            const info = WARNING_CODE_MAP[code] || { name: `警報コード${code}`, level: "advisory" };
            const pill = document.createElement("span");
            pill.className = "pill " + info.level;
            pill.textContent = info.name;
            warningsEl.appendChild(pill);
        });
    } catch (err) {
        warningsEl.innerHTML = `<p style="text-align:center;color:#c33;">警報情報の取得に失敗しました</p>`;
    }
}

async function loadWeatherMap() {
    const mapCardEl = document.getElementById("mapCard");
    try {
        const res = await fetch("https://www.jma.go.jp/bosai/weather_map/data/list.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const list = await res.json();
        const files = list.near.now;
        const latestFile = files[files.length - 1];
        const imgUrl = `https://www.jma.go.jp/bosai/weather_map/data/png/${latestFile}`;

        // ファイル名先頭14桁 = 発表時刻（例: 20260803080030）
        const ts = latestFile.slice(0, 14);
        const label = `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)} ${ts.slice(8,10)}:${ts.slice(10,12)}`;

        mapCardEl.innerHTML = `
            <img src="${imgUrl}" alt="地上天気図">
            <p class="detail">発表: ${label}</p>
        `;
    } catch (err) {
        mapCardEl.innerHTML = `<p style="text-align:center;color:#c33;">天気図の取得に失敗しました</p>`;
    }
}

loadForecast();
loadWarnings();
loadWeatherMap();
</script>
</body>
</html>
