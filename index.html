<script src="https://cdn.jsdelivr.net/npm/satellite.js@5/dist/satellite.min.js"></script>
<script>
const OFFICE_CODE = "130000";   // 東京都
const FORECAST_AREA_CODE = "130010"; // 東京地方（八王子市を含む）
const TEMP_AREA_CODE = "44132"; // 東京（大手町）
const HACHIOJI_CLASS20 = "1320100"; // 八王子市（警報・注意報用）

// SKILL.mdで実データ照合済みのコード→名称対応。未知のコードはそのままコード表示する。
const WARNING_CODE_MAP = {
    "03": { name: "大雨警報", level: "warning" },
    "07": { name: "波浪警報", level: "warning" },
    "14": { name: "雷注意報", level: "advisory" },
    "15": { name: "強風注意報", level: "advisory" },
    "16": { name: "波浪注意報", level: "advisory" },
    "20": { name: "濃霧注意報", level: "advisory" },
    "29": { name: "土砂災害警戒情報", level: "danger" }
};

// 天気文の中に出てくる言葉を順番に拾ってアイコンに変換する
const WEATHER_ICON_PATTERNS = [
    { pattern: /晴/, icon: "☀️" },
    { pattern: /雷/, icon: "⚡" },
    { pattern: /雪/, icon: "❄️" },
    { pattern: /雨/, icon: "☔" },
    { pattern: /霧/, icon: "🌫️" },
    { pattern: /曇|くもり/, icon: "☁️" }
];

function getWeatherIcons(text) {
    // 出現位置順に並べたいので、まず各パターンの最初のマッチ位置を調べる
    const found = WEATHER_ICON_PATTERNS
        .map(({ pattern, icon }) => ({ icon, index: text.search(pattern) }))
        .filter(({ index }) => index !== -1)
        .sort((a, b) => a.index - b.index);
    return found.length ? found.map(f => f.icon).join(" ") : "🌡️";
}

async function loadForecast() {
    const cardsEl = document.getElementById("cards");
    const updatedEl = document.getElementById("updated");
    try {
        const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${OFFICE_CODE}.json`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        const shortTerm = data[0];
        const weatherSeries = shortTerm.timeSeries[0];
        const popSeries = shortTerm.timeSeries[1];
        const areaIndex = weatherSeries.areas.findIndex(a => a.area.code === FORECAST_AREA_CODE);
        const weatherArea = weatherSeries.areas[areaIndex >= 0 ? areaIndex : 0];
        const popAreaIndex = popSeries.areas.findIndex(a => a.area.code === FORECAST_AREA_CODE);
        const popArea = popSeries.areas[popAreaIndex >= 0 ? popAreaIndex : 0];

        let tempsByDate = {};
        const weekly = data[1];
        if (weekly) {
            const tempSeries = weekly.timeSeries.find(ts => ts.areas[0].tempsMin || ts.areas[0].tempsMax);
            if (tempSeries) {
                const tempArea = tempSeries.areas.find(a => a.area.code === TEMP_AREA_CODE) || tempSeries.areas[0];
                tempSeries.timeDefines.forEach((d, i) => {
                    const date = d.slice(0, 10);
                    tempsByDate[date] = {
                        min: tempArea.tempsMin ? tempArea.tempsMin[i] : "",
                        max: tempArea.tempsMax ? tempArea.tempsMax[i] : ""
                    };
                });
            }
        }

        const reportDate = new Date(data[0].reportDatetime);
        updatedEl.textContent = "更新: " + reportDate.toLocaleString("ja-JP");

        cardsEl.innerHTML = "";
        weatherSeries.timeDefines.forEach((dateStr, i) => {
            const date = dateStr.slice(0, 10);
            const weather = weatherArea.weathers[i].replace(/\s+/g, " ").trim();

            let pop = "-";
            const popIdx = popSeries.timeDefines.findIndex(d => d.slice(0, 10) === date);
            if (popIdx !== -1 && popArea.pops) {
                pop = popArea.pops[popIdx] + "%";
            }

            const temp = tempsByDate[date];
            const tempText = temp && (temp.min || temp.max)
                ? `最低 ${temp.min || "-"}度 / 最高 ${temp.max || "-"}度`
                : "-";

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h2>${date}</h2>
                <p class="icons">${getWeatherIcons(weather)}</p>
                <p class="weather">${weather}</p>
                <p class="detail">降水確率: ${pop}</p>
                <p class="detail">気温: ${tempText}</p>
            `;
            cardsEl.appendChild(card);
        });
    } catch (err) {
        updatedEl.textContent = "天気データの取得に失敗しました";
        cardsEl.innerHTML = `<p style="text-align:center;color:#c33;">${err.message}</p>`;
    }
}

async function loadWarnings() {
    const warningsEl = document.getElementById("warnings");
    try {
        const res = await fetch(`https://www.jma.go.jp/bosai/warning/data/r8/${OFFICE_CODE}.json`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const events = await res.json();

        // コードごとに最新（reportDatetimeが最大）のステータスだけを残す
        const latestByCode = {};
        for (const event of events) {
            const items = (event.warning && event.warning.class20Items) || [];
            const area = items.find(a => a.areaCode === HACHIOJI_CLASS20);
            if (!area) continue;
            for (const kind of area.kinds) {
                if (!kind.code) continue; // コードなし = 発表なし
                const prev = latestByCode[kind.code];
                if (!prev || new Date(event.reportDatetime) > new Date(prev.reportDatetime)) {
                    latestByCode[kind.code] = { status: kind.status, reportDatetime: event.reportDatetime };
                }
            }
        }

        const active = Object.entries(latestByCode).filter(
            ([, v]) => v.status !== "解除" && !v.status.includes("なし")
        );

        if (active.length === 0) {
            warningsEl.innerHTML = `<p class="no-warning">現在、発表中の警報・注意報はありません</p>`;
            return;
        }

        warningsEl.innerHTML = "";
        active.forEach(([code, v]) => {
            const info = WARNING_CODE_MAP[code] || { name: `警報コード${code}`, level: "advisory" };
            const pill = document.createElement("span");
            pill.className = "pill " + info.level;
            pill.textContent = info.name;
            warningsEl.appendChild(pill);
        });
    } catch (err) {
        warningsEl.innerHTML = `<p style="text-align:center;color:#c33;">警報情報の取得に失敗しました</p>`;
    }
}

async function loadWeatherMap() {
    const mapCardEl = document.getElementById("mapCard");
    try {
        const res = await fetch("https://www.jma.go.jp/bosai/weather_map/data/list.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const list = await res.json();
        const files = list.near.now;
        const latestFile = files[files.length - 1];
        const imgUrl = `https://www.jma.go.jp/bosai/weather_map/data/png/${latestFile}`;

        // ファイル名先頭14桁 = 発表時刻（例: 20260803080030）
        const ts = latestFile.slice(0, 14);
        const label = `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)} ${ts.slice(8,10)}:${ts.slice(10,12)}`;

        mapCardEl.innerHTML = `
            <img src="${imgUrl}" alt="地上天気図">
            <p class="detail">発表: ${label}</p>
        `;
    } catch (err) {
        mapCardEl.innerHTML = `<p style="text-align:center;color:#c33;">天気図の取得に失敗しました</p>`;
    }
}

// 日本列島の輪郭（Natural Earth 50m, パブリックドメインを簡略化）を
// 経度127-147度・緯度29-46.5度の範囲でSVG座標(520x620)に投影済みのパスデータ
const JAPAN_MAP = { lonMin: 127, lonMax: 147, latMin: 29, latMax: 46.5, w: 520, h: 620 };
const JAPAN_PATH = "M437.4,84.4L460.6,91.1L477.6,77L471.6,100.5L476.9,113.3L489.7,110.3L465.9,124L441.2,128.2L427.2,144.6L422.2,159.4L386.1,138.9L363.6,147.3L350.5,139.6L346.5,149L367.9,166.3L355.2,165.9L345,178.7L339,178.1L340.8,162.5L333.7,149.6L334.4,138.8L349.2,125.6L348.2,113.3L367.6,117.6L373.7,114.1L383.8,71.5L379.2,47.6L381.4,38.9L388.4,35.1L413,64.8L437.4,84.4Z M370,181.6L375.8,180.5L375.2,204.7L384.7,220L389.4,250.5L376.1,286.8L366.8,289.2L363,295.9L364.1,332.5L352.9,363.8L360.7,381.7L349.9,389.4L347.2,401L333.9,410.4L333.5,396.9L340.5,386.7L333.7,384.1L328.9,392.9L329.6,402.1L318.5,397.6L314.2,413.1L307.8,420.9L306.9,408.3L309.5,406.5L304.7,403L290.9,421.7L261.6,422.2L267.2,415.5L259,413.3L256.6,416.9L254.9,405.7L247.9,418.8L256.9,427.5L256.2,431.4L242.6,436.6L231.8,458.4L226.1,461L219.8,458.7L211.3,442.6L210.6,432.7L218.8,421L201.2,415.8L159.7,432.2L138.1,431.3L133.8,448.6L123.3,441L101.9,443.7L104.1,428.9L113.2,428.2L154,389.3L181.5,389.5L212.5,381L216.5,388.8L231.5,385.9L236.5,380.2L235.7,367.9L252.1,345.7L255.9,323L268.4,318.1L257.4,332.4L260.4,342.3L266.4,345.3L294.3,328.8L309,306.7L321.5,297.6L332.9,269.9L339.7,243.6L337.9,235.4L331.3,233.1L338.3,221.1L337.1,206.4L345.3,200.3L348,186.7L354.3,187.9L357.5,200.9L367.1,199L370.3,187.6L358.8,189.9L358.9,185.9L362.4,176.9L370,181.6Z M191.3,433.8L198.6,434.8L201.2,449.2L191.8,456.7L186.7,469.5L172.4,460.2L163.4,465.5L150.9,487.1L142.9,481.2L140.7,463.1L130.9,466.2L146.7,453.8L154.3,439.5L161,445.2L171.1,442.3L171.7,434.2L180.6,430.5L191.3,433.8Z M108.6,456.9L122.1,456.9L118,468.6L127.3,469.3L130.1,482.5L121.2,497.2L112.8,534.8L105.8,533.7L106.5,540.1L95.8,548.6L98.2,524.1L92.5,529.2L93.3,542.8L81.8,534.7L86.4,527.9L83,510.5L94.7,491.8L90.9,490.4L92.2,484.2L84.2,472L81.3,474.6L82.6,483.6L86.5,483.5L86.8,488.8L79.4,486.4L72,493.5L69.7,476.2L77.8,483.5L67.1,469.9L96.6,445.4L102.8,447.4L108.6,456.9Z";

// ISSが日本上空を通る際に「直下に一番近い都市」を基準観測地点として選ぶための候補リスト
const CITIES = [
    { name: "札幌", lat: 43.0642, lon: 141.3469 },
    { name: "仙台", lat: 38.2682, lon: 140.8694 },
    { name: "新潟", lat: 37.9026, lon: 139.0232 },
    { name: "金沢", lat: 36.5613, lon: 136.6562 },
    { name: "八王子", lat: 35.6564, lon: 139.3390 },
    { name: "名古屋", lat: 35.1815, lon: 136.9066 },
    { name: "大阪", lat: 34.6937, lon: 135.5023 },
    { name: "広島", lat: 34.3853, lon: 132.4553 },
    { name: "高松", lat: 34.3401, lon: 134.0434 },
    { name: "福岡", lat: 33.5904, lon: 130.4017 },
    { name: "鹿児島", lat: 31.5966, lon: 130.5571 },
];

const DEG2RAD = Math.PI / 180, RAD2DEG = 180 / Math.PI;
const AU_KM = 149597870.7;
const EARTH_RADIUS_KM = 6378.137;
const MIN_MAX_ELEVATION_DEG = 10; // 最高高度がこれ未満の、地平線をかすめるだけの通過は対象外にする
const DARK_SKY_SUN_ELEVATION_DEG = -6; // 市民薄明（これより太陽が低ければ空が暗いとみなす）

function projectLatLon(lat, lon) {
    const x = ((lon - JAPAN_MAP.lonMin) / (JAPAN_MAP.lonMax - JAPAN_MAP.lonMin)) * JAPAN_MAP.w;
    const y = ((JAPAN_MAP.latMax - lat) / (JAPAN_MAP.latMax - JAPAN_MAP.latMin)) * JAPAN_MAP.h;
    return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
}

function nearestCity(lat, lon) {
    let best = null, bestDist = Infinity;
    for (const c of CITIES) {
        const d = (c.lat - lat) ** 2 + (c.lon - lon) ** 2;
        if (d < bestDist) { bestDist = d; best = c; }
    }
    return best;
}

// 低精度太陽位置式（Astronomical Almanacの簡易式、精度は角度で約0.01度）
function sunPositionEci(date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const n = jd - 2451545.0;
    const L = ((280.460 + 0.9856474 * n) % 360 + 360) % 360;
    const g = (((357.528 + 0.9856003 * n) % 360 + 360) % 360) * DEG2RAD;
    const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG2RAD;
    const epsilon = (23.439 - 0.0000004 * n) * DEG2RAD;
    return {
        x: Math.cos(lambda) * AU_KM,
        y: Math.cos(epsilon) * Math.sin(lambda) * AU_KM,
        z: Math.sin(epsilon) * Math.sin(lambda) * AU_KM
    };
}

// 円柱影モデルで、ISSが地球の影に入っていないか（太陽に照らされているか）を判定する
function isSunlit(satEci, sunEci) {
    const dot = satEci.x * sunEci.x + satEci.y * sunEci.y + satEci.z * sunEci.z;
    if (dot > 0) return true;
    const sunDist = Math.hypot(sunEci.x, sunEci.y, sunEci.z);
    const satDist = Math.hypot(satEci.x, satEci.y, satEci.z);
    const cosTheta = dot / (satDist * sunDist);
    const sinTheta = Math.sqrt(Math.max(0, 1 - cosTheta * cosTheta));
    return satDist * sinTheta > EARTH_RADIUS_KM;
}

const COMPASS_JA = ["北", "北北東", "北東", "東北東", "東", "東南東", "南東", "南南東", "南", "南南西", "南西", "西南西", "西", "西北西", "北西", "北北西"];
function azimuthToCompass(azimuthRad) {
    const deg = ((azimuthRad * RAD2DEG) % 360 + 360) % 360;
    return COMPASS_JA[Math.round(deg / 22.5) % 16];
}

// ある時刻・ある都市から見たISSと太陽の方位角・高度、および太陽照射の有無をまとめて計算する
function computeLook(satrecPos, gmst, city, sunEci) {
    const satEcf = satellite.eciToEcf(satrecPos, gmst);
    const sunEcf = satellite.eciToEcf(sunEci, gmst);
    const observerGd = { latitude: city.lat * DEG2RAD, longitude: city.lon * DEG2RAD, height: 0.1 };
    const satLook = satellite.ecfToLookAngles(observerGd, satEcf);
    const sunLook = satellite.ecfToLookAngles(observerGd, sunEcf);
    return {
        elevationDeg: satLook.elevation * RAD2DEG,
        azimuthRad: satLook.azimuth,
        sunElevationDeg: sunLook.elevation * RAD2DEG
    };
}

function formatJst(date) {
    return date.toLocaleString("ja-JP", {
        timeZone: "Asia/Tokyo", month: "numeric", day: "numeric",
        hour: "2-digit", minute: "2-digit"
    });
}

function renderIssPass(pass) {
    const issCardEl = document.getElementById("issCard");
    const toPath = pts => "M" + pts.map(([lat, lon]) => projectLatLon(lat, lon).join(",")).join(" L");
    const trackPath = toPath(pass.track);
    const cityMarker = projectLatLon(pass.city.lat, pass.city.lon);
    const issMarker = projectLatLon(...pass.track[Math.floor(pass.track.length / 2)]);

    const cityDots = CITIES.map(c => {
        const [x, y] = projectLatLon(c.lat, c.lon);
        const isRef = c === pass.city;
        return `<circle class="${isRef ? "iss-city-ref" : "iss-city"}" cx="${x}" cy="${y}" r="${isRef ? 5 : 2.5}"></circle>`;
    }).join("");

    issCardEl.innerHTML = `
        <p class="detail">基準都市: ${pass.city.name}の空</p>
        <p class="detail">${formatJst(pass.start)} ごろ、${azimuthToCompass(pass.startAz)}の空から見え始め</p>
        <p class="detail">${formatJst(pass.end)} ごろ、${azimuthToCompass(pass.endAz)}の空に消えていきます</p>
        <p class="detail">（最高高度 約${Math.round(pass.maxElevation)}度、約${Math.round((pass.end - pass.start) / 1000)}秒間）</p>
        <svg viewBox="0 0 ${JAPAN_MAP.w} ${JAPAN_MAP.h}">
            <path class="iss-land" d="${JAPAN_PATH}"></path>
            ${cityDots}
            <path class="iss-track" d="${trackPath}"></path>
            <text class="iss-marker" x="${issMarker[0]}" y="${issMarker[1]}">🛰️</text>
            <text class="iss-city-label" x="${cityMarker[0]}" y="${cityMarker[1] - 9}">${pass.city.name}</text>
        </svg>
    `;
}

async function loadIssPass() {
    const issCardEl = document.getElementById("issCard");
    try {
        const res = await fetch("https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const lines = (await res.text()).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const satrec = satellite.twoline2satrec(lines[1], lines[2]);

        const stepSec = 15;
        const searchDays = 10;
        const maxSteps = Math.floor((searchDays * 86400) / stepSec);
        const start = new Date();

        let pass = null;
        let found = null;

        for (let i = 0; i < maxSteps && !found; i++) {
            const t = new Date(start.getTime() + i * stepSec * 1000);
            const posVel = satellite.propagate(satrec, t);
            if (!posVel.position) continue;
            const gmst = satellite.gstime(t);

            let city;
            if (pass) {
                city = pass.city; // 通過中は最初に選んだ都市を基準にし続ける（都市が途中で切り替わらないように）
            } else {
                const geo = satellite.eciToGeodetic(posVel.position, gmst);
                city = nearestCity(satellite.degreesLat(geo.latitude), satellite.degreesLong(geo.longitude));
            }

            const sunEci = sunPositionEci(t);
            const look = computeLook(posVel.position, gmst, city, sunEci);
            const illuminated = isSunlit(posVel.position, sunEci);
            const visible = look.elevationDeg > 0 && illuminated && look.sunElevationDeg < DARK_SKY_SUN_ELEVATION_DEG;

            if (visible) {
                if (!pass) pass = { city, start: t, startAz: look.azimuthRad, maxElevation: -90, track: [] };
                pass.end = t;
                pass.endAz = look.azimuthRad;
                if (look.elevationDeg > pass.maxElevation) pass.maxElevation = look.elevationDeg;
                const geo = satellite.eciToGeodetic(posVel.position, gmst);
                pass.track.push([satellite.degreesLat(geo.latitude), satellite.degreesLong(geo.longitude)]);
            } else if (pass) {
                if (pass.maxElevation >= MIN_MAX_ELEVATION_DEG) {
                    found = pass;
                } else {
                    pass = null; // 地平線をかすめるだけの弱い通過は捨てて次を探す
                }
            }
        }

        if (!found) {
            issCardEl.innerHTML = `<p style="text-align:center;">今後${searchDays}日以内に肉眼で見えそうな通過予定は見つかりませんでした</p>`;
            return;
        }

        renderIssPass(found);
    } catch (err) {
        issCardEl.innerHTML = `<p style="text-align:center;color:#c33;">ISS情報の取得に失敗しました: ${err.message}</p>`;
    }
}

loadForecast();
loadWarnings();
loadWeatherMap();
loadIssPass();
